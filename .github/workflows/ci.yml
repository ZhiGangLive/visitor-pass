name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['16', '18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查（零依赖，不需要 install）
        run: npm run check

      - name: 冒烟测试（真起服务，走完整链路）
        run: npm run smoke

  policy:
    name: 零依赖检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认没有引入任何依赖
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(p.dependencies || {}).concat(Object.keys(p.devDependencies || {}));
            if (deps.length) {
              console.error('本项目承诺零依赖，检测到：' + deps.join(', '));
              process.exit(1);
            }
            console.log('零依赖检查通过');
          "

      - name: 确认没有提交业务数据
        run: |
          if git ls-files | grep -E '^data/'; then
            echo "data/ 目录不应入库，其中包含真实访客信息";
            exit 1;
          fi
          echo "data/ 未被提交"
